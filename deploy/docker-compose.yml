# Local development stack.
#
#   docker compose -f deploy/docker-compose.yml up -d                  # core: postgres, s3, keycloak, redpanda
#   docker compose -f deploy/docker-compose.yml --profile full up -d   # + opensearch, temporal
#
# IMAGE_PREFIX lets you pull through a registry mirror, e.g. IMAGE_PREFIX=mirror.gcr.io/
name: plm

services:
  postgres:
    image: ${IMAGE_PREFIX:-}postgres:18-alpine
    environment:
      POSTGRES_DB: plm
      POSTGRES_USER: plm
      POSTGRES_PASSWORD: plm
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm -d plm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for the file vault (ADR 0007).
  # Dev only: any S3-compatible service works, the app speaks the S3 API.
  s3:
    image: ${IMAGE_PREFIX:-}chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["8333:8333"]
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  keycloak:
    image: ${IMAGE_PREFIX:-}keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]

  # Event bus (ADR 0008). Domain events are relayed here from the outbox.
  redpanda:
    image: ${IMAGE_PREFIX:-}redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]

  opensearch:
    profiles: ["full"]
    image: ${IMAGE_PREFIX:-}opensearchproject/opensearch:3.10.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]

  temporal:
    profiles: ["full"]
    image: ${IMAGE_PREFIX:-}temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # Web UI

volumes:
  postgres-data:
  s3-data:
  opensearch-data:
