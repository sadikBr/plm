name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # ktlint + compile (warnings are errors) + unit, ArchUnit and Testcontainers integration tests.
      - run: ./gradlew build --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/"

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The typed client is generated from api/openapi.json, which the backend's
      # OpenApiContractIT keeps in sync. A breaking API change fails typecheck here.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Desktop clients (roadmap 8): their unit tests (no server needed).
      - run: npm test
        working-directory: clients/plm-sync
      - run: python3 -m unittest discover -s tests
        working-directory: connectors/freecad

  dev-stack:
    name: Validate dev stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f deploy/docker-compose.yml --profile full config --quiet
