[versions]
kotlin = "2.4.21"
spring-boot = "4.1.2"
ktlint-gradle = "14.2.0"
archunit = "1.5.1"
springdoc = "3.2.0"
cel = "0.11.1"
awssdk = "2.31.0"
pdfbox = "3.0.5"
temporal = "1.32.1"
rhino = "1.7.15"

[libraries]
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }

# Versions below are managed by the Spring Boot BOM unless pinned.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-web = { module = "org.springframework:spring-web" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-redpanda = { module = "org.testcontainers:testcontainers-redpanda" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# Common Expression Language, for conditions, validations, formulas and gates (roadmap 2.2).
cel = { module = "dev.cel:cel", version.ref = "cel" }
# The file vault's S3 store (roadmap 3.2).
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awssdk" }
# PDF thumbnails (roadmap 3.2).
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[bundles]
# Everything a domain module needs to expose a service, persist with SQL and serve REST.
module-runtime = ["spring-context", "spring-tx", "spring-jdbc", "spring-web", "jackson-databind"]
