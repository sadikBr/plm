spring:
  # Outgoing mail (reports, alerts, notifications). make up runs Mailpit: http://localhost:8025
  mail:
    host: ${PLM_MAIL_HOST:localhost}
    port: ${PLM_MAIL_PORT:1025}
  application:
    name: plm
  datasource:
    url: ${PLM_DB_URL:jdbc:postgresql://localhost:5432/plm}
    username: ${PLM_DB_USER:plm}
    password: ${PLM_DB_PASSWORD:plm}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are discovered from the issuer on first use, so the app starts even if Keycloak is still booting.
          issuer-uri: ${PLM_OIDC_ISSUER:http://localhost:8180/realms/plm}
          # Tokens must be minted for this API (Keycloak audience mapper on the plm-web client).
          audiences: ${PLM_OIDC_AUDIENCE:plm-api}
  kafka:
    bootstrap-servers: ${PLM_KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      # Framework errors (malformed JSON, unknown routes) also use RFC 9457 problem details.
      enabled: true
  flyway:
    # Each module owns a subfolder: db/migration/<module>/V<yyyyMMddHHmm>__<desc>.sql
    # Timestamp versions keep modules from colliding on version numbers.
    locations: classpath:db/migration

server:
  port: ${PLM_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Mail is optional and goes out in the background: a mail server that's down mustn't make the
    # platform unhealthy (and take it out of a load balancer).
    mail:
      enabled: false

plm:
  identity:
    # The built-in site administrator, made with the installation (deploy/keycloak/plm-realm.json).
    # One site administrator is recommended; Administration warns when there are more.
    built-in-admin: ${PLM_BUILT_IN_ADMIN:plmadmin}
    # true: only the built-in administrator gets site administration rights, even if others hold the role.
    only-built-in: ${PLM_ONLY_BUILT_IN_ADMIN:false}
  # Where people open the web UI: links in mail point here.
  ui-url: ${PLM_UI_URL:http://localhost:5173}
  mail:
    enabled: ${PLM_MAIL_ENABLED:true}
    from: ${PLM_MAIL_FROM:PLM <plm@localhost>}
  search:
    # postgres (built in) or opensearch (make up-full).
    engine: ${PLM_SEARCH_ENGINE:postgres}
    opensearch:
      url: ${PLM_SEARCH_OPENSEARCH_URL:http://localhost:9200}
  vault:
    # file (a local folder) or s3 (deploy/docker-compose.yml runs an S3-compatible store).
    store: ${PLM_VAULT_STORE:s3}
    max-size: ${PLM_VAULT_MAX_SIZE:2GB}
    signing-key: ${PLM_VAULT_SIGNING_KEY:dev-only-vault-signing-key-change-me}
    s3:
      endpoint: ${PLM_VAULT_S3_ENDPOINT:http://localhost:8333}
      region: ${PLM_VAULT_S3_REGION:us-east-1}
      bucket: ${PLM_VAULT_S3_BUCKET:plm-vault}
      access-key: ${PLM_VAULT_S3_ACCESS_KEY:plm}
      secret-key: ${PLM_VAULT_S3_SECRET_KEY:plm-dev-secret}
  workflow:
    temporal:
      # The Temporal service (make up-full runs one at localhost:7233), or in-memory: Temporal's
      # in-process server, for trying things out (processes then don't survive a restart).
      target: ${PLM_TEMPORAL_TARGET:in-memory}
      namespace: ${PLM_TEMPORAL_NAMESPACE:default}
  events:
    topic: plm.domain-events
    relay:
      enabled: ${PLM_EVENTS_RELAY_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  # Only the product API, not actuator.
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    oauth:
      client-id: plm-web
      use-pkce-with-authorization-code-grant: true
